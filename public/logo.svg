<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#c026d3"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle Fill (Dark Slate contrast) -->
  <circle cx="200" cy="200" r="190" fill="#090d16"/>

  <!-- Outer Pink Ring -->
  <circle cx="200" cy="200" r="170" fill="none" stroke="url(#pinkGrad)" stroke-width="14" />
  <circle cx="200" cy="200" r="145" fill="none" stroke="#f43f5e" stroke-width="3" stroke-dasharray="6 6" opacity="0.6"/>

  <!-- Woman Silhouette (Stylized Pink Silhouette) -->
  <g fill="url(#pinkGrad)">
    <!-- Head & Flowing Long Hair -->
    <path d="M 200 80 C 185 80 170 92 165 110 C 158 128 152 155 140 180 C 132 195 120 215 110 230 C 122 225 138 215 148 205 C 155 198 162 180 168 165 C 170 155 172 140 178 130 C 182 122 190 115 198 115 C 208 115 218 122 225 130 C 235 142 240 160 248 178 C 255 195 262 215 272 232 C 265 215 258 190 252 170 C 248 155 242 135 235 120 C 228 100 215 80 200 80 Z" />

    <!-- Head profile -->
    <ellipse cx="202" cy="118" rx="22" ry="26" />
    <!-- Arm reaching to head/hair -->
    <path d="M 215 135 C 232 125 252 105 268 85 C 262 82 250 88 238 98 C 225 110 218 122 215 135 Z" />

    <!-- Torso and Bust -->
    <path d="M 180 142 C 192 145 208 145 220 150 C 235 158 248 175 252 192 C 255 208 248 225 240 240 C 230 260 218 280 205 300 C 192 285 180 265 172 245 C 165 225 162 205 168 185 C 172 168 175 152 180 142 Z" />

    <!-- Lower Hips/Legs curvature -->
    <path d="M 205 300 C 220 280 238 255 250 235 C 260 220 268 200 265 180 C 262 165 252 152 240 145 C 228 138 210 138 195 140 C 182 142 170 150 162 162 C 150 180 145 205 150 230 C 158 260 175 285 205 300 Z" opacity="0.95" />

    <!-- Bottom Wave Decorative Swirl -->
    <path d="M 100 320 C 150 300 200 330 250 310 C 280 298 310 305 330 320 C 300 328 260 325 230 335 C 180 350 130 335 100 320 Z" />
    <path d="M 120 340 C 170 325 220 348 270 335 C 295 328 320 335 340 345 C 310 350 270 348 240 355 C 190 365 150 355 120 340 Z" opacity="0.6" />
  </g>
</svg>
